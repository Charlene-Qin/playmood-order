<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>玩物智所 採購單系統</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,'Microsoft JhengHei',sans-serif;background:#F2F2F2;color:#1A1A1A;font-size:13px}
#app{display:flex;flex-direction:column;min-height:100vh}
/* HEADER */
.header{background:#FFE600;padding:14px 20px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #1A1A1A}
.header-logo{font-size:20px;font-weight:900;letter-spacing:.5px}
.header-sub{font-size:11px;color:#555;margin-top:2px}
/* INFO BAR */
.info-bar{background:#fff;border-bottom:2px solid #FFE600;padding:14px 20px}
.info-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.info-grid-full{grid-column:1/-1}
.field label{display:block;font-size:10px;font-weight:700;color:#777;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.field input,.field select,.field textarea{width:100%;padding:7px 10px;border:1.5px solid #DDD;border-radius:4px;font-size:13px;font-family:inherit;background:#FAFAFA;color:#1A1A1A;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#FFE600;background:#fff}
.type-row{display:flex;gap:8px;margin-top:12px}
.type-btn{flex:1;padding:8px;border:2px solid #DDD;border-radius:4px;background:#fff;cursor:pointer;font-size:12px;font-weight:700;text-align:center;color:#999;transition:all .15s}
.type-btn.on{border-color:#1A1A1A;background:#1A1A1A;color:#FFE600}
/* LAYOUT */
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:160px;flex-shrink:0;background:#1A1A1A;overflow-y:auto}
.cat-btn{display:block;width:100%;padding:11px 14px;border:none;background:transparent;color:#AAA;text-align:left;cursor:pointer;font-size:12px;font-weight:700;border-bottom:1px solid #2A2A2A;transition:all .15s}
.cat-btn:hover{background:#2A2A2A;color:#FFE600}
.cat-btn.on{background:#FFE600;color:#1A1A1A}
.cat-count{float:right;background:#333;color:#888;font-size:10px;padding:1px 5px;border-radius:10px}
.cat-btn.on .cat-count{background:#1A1A1A;color:#FFE600}
/* PRODUCT GRID */
.prod-pane{flex:1;overflow-y:auto;padding:14px}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px}
.pcard{background:#fff;border:1.5px solid #E8E8E8;border-radius:6px;overflow:hidden;transition:border-color .15s}
.pcard:hover{border-color:#CCC}
.pcard.sel{border-color:#FFE600;box-shadow:0 0 0 1.5px #FFE600}
.pimg{height:88px;background:#F6F6F6;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #EEE;overflow:hidden}
.pimg img{max-width:100%;max-height:100%;object-fit:contain}
.pimg-placeholder{width:44px;height:44px;background:#EEE;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#BBB;font-size:20px}
.pbody{padding:8px 10px 10px}
.pname{font-size:11px;font-weight:700;line-height:1.4;margin-bottom:3px;color:#1A1A1A}
.pspec{font-size:10px;color:#999;line-height:1.3;margin-bottom:4px}
.pprice{font-size:13px;font-weight:900;color:#1A1A1A;margin-bottom:6px}
.ptbd{font-size:10px;color:#888;font-style:italic;margin-bottom:6px}
.tag-tbd{display:inline-block;background:#FFE600;color:#1A1A1A;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;margin-bottom:3px}
.tag-spec{display:inline-block;background:#1A1A1A;color:#FFE600;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;margin-bottom:3px;margin-left:3px}
.qty-row{display:flex;align-items:center;gap:6px;margin-top:2px}
.qbtn{width:26px;height:26px;border:1.5px solid #CCC;border-radius:4px;background:#fff;cursor:pointer;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#1A1A1A;transition:all .1s;line-height:1}
.qbtn:hover{background:#FFE600;border-color:#1A1A1A}
.qnum{min-width:22px;text-align:center;font-size:13px;font-weight:700}
.note-inp{width:100%;margin-top:6px;padding:5px 7px;border:1.5px solid #E0E0E0;border-radius:4px;font-size:11px;font-family:inherit;resize:none;background:#FFFDF0;color:#1A1A1A}
.note-inp:focus{outline:none;border-color:#FFE600}
/* CART */
.cart-panel{width:280px;flex-shrink:0;background:#1A1A1A;display:flex;flex-direction:column;overflow:hidden}
.cart-header{padding:14px 16px 10px;border-bottom:1px solid #2A2A2A}
.cart-title{font-size:14px;font-weight:700;color:#FFE600}
.cart-cnt{font-size:11px;color:#888;margin-top:2px}
.cart-list{flex:1;overflow-y:auto;padding:8px 16px}
.cart-empty{color:#666;font-size:12px;padding:16px 0;text-align:center}
.citem{padding:8px 0;border-bottom:1px solid #2A2A2A}
.citem:last-child{border-bottom:none}
.cname{font-size:11px;color:#DDD;line-height:1.4}
.cqty{color:#888;font-size:10px}
.cnote{font-size:10px;color:#666;margin-top:2px;font-style:italic}
.crow{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-top:3px}
.cprice{font-size:12px;font-weight:700;color:#FFE600;white-space:nowrap}
.cremove{font-size:10px;color:#555;cursor:pointer;white-space:nowrap}
.cremove:hover{color:#FF4444}
.cart-footer{padding:12px 16px;border-top:1px solid #333}
.total-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.total-lbl{font-size:11px;color:#888}
.total-num{font-size:20px;font-weight:900;color:#FFE600}
.cart-note{font-size:10px;color:#555;margin-bottom:10px;line-height:1.5}
.submit-btn{width:100%;padding:11px;border:none;border-radius:5px;background:#FFE600;color:#1A1A1A;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s}
.submit-btn:hover{background:#EED800}
/* RESULT PAGE */
#result-page{display:none;flex-direction:column;align-items:center;padding:40px 20px;background:#F2F2F2;min-height:100vh}
.result-box{background:#fff;border-radius:8px;border:2px solid #FFE600;max-width:700px;width:100%;padding:30px}
.result-header{background:#FFE600;margin:-30px -30px 24px;padding:20px 30px;border-radius:6px 6px 0 0}
.result-header h2{font-size:20px;font-weight:900}
.result-header p{font-size:12px;color:#555;margin-top:4px}
.result-info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px;padding-bottom:16px;border-bottom:1.5px solid #EEE}
.ri-row{font-size:12px}
.ri-label{color:#888;margin-right:6px}
.ri-val{font-weight:700}
.result-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:20px}
.result-table th{background:#1A1A1A;color:#FFE600;padding:8px 10px;text-align:left;font-weight:700}
.result-table td{padding:7px 10px;border-bottom:1px solid #EEE;vertical-align:top}
.result-table tr:last-child td{border-bottom:none}
.result-table tr:nth-child(even) td{background:#FAFAFA}
.result-total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-top:2px solid #1A1A1A;margin-bottom:20px}
.result-total-lbl{font-size:13px;color:#666}
.result-total-num{font-size:24px;font-weight:900}
.dl-row{display:flex;gap:12px;margin-bottom:16px}
.dl-btn{flex:1;padding:12px;border:2px solid #1A1A1A;border-radius:5px;background:#fff;cursor:pointer;font-size:13px;font-weight:700;text-align:center;transition:all .15s;font-family:inherit}
.dl-btn:hover{background:#1A1A1A;color:#FFE600}
.dl-btn.primary{background:#FFE600;border-color:#FFE600;color:#1A1A1A}
.dl-btn.primary:hover{background:#EED800}
.email-status{background:#E1F5EE;border:1px solid #5DCAA5;color:#085041;border-radius:4px;padding:10px 14px;font-size:12px;text-align:center;margin-bottom:14px;display:none}
.back-btn{background:transparent;border:1.5px solid #CCC;border-radius:4px;padding:8px 20px;cursor:pointer;font-size:12px;color:#888;font-family:inherit}
.back-btn:hover{color:#1A1A1A;border-color:#1A1A1A}
@media(max-width:700px){
  .main{flex-direction:column}
  .sidebar{width:100%;display:flex;flex-wrap:nowrap;overflow-x:auto;height:auto}
  .cat-btn{white-space:nowrap;border-bottom:none;border-right:1px solid #2A2A2A;padding:9px 12px}
  .cart-panel{width:100%}
  .info-grid{grid-template-columns:1fr 1fr}
  .dl-row{flex-direction:column}
}
</style>
</head>
<body>
<div id="app">
  <!-- ORDER FORM PAGE -->
  <div id="order-page">
    <div class="header">
      <div>
        <div class="header-logo">玩物智所 PLAYMOOD STUDIO</div>
        <div class="header-sub">產品採購單系統 Product Order Form</div>
      </div>
    </div>
    <div class="info-bar">
      <div class="info-grid">
        <div class="field"><label>採購人姓名 *</label><input id="f-name" type="text" placeholder="王小明"></div>
        <div class="field"><label>聯絡方式</label><input id="f-contact" type="text" placeholder="電話 / LINE"></div>
        <div class="field"><label>案件名稱 / 工地地址</label><input id="f-project" type="text" placeholder="例：忠孝東路住宅"></div>
        <div class="field info-grid-full"><label>備註 / 特殊需求</label><input id="f-global-note" type="text" placeholder="例：配合工期、風格偏好、顏色系統偏好…"></div>
      </div>
      <div class="type-row">
        <div class="type-btn on" id="tb-new" onclick="setType('new')">首次採購</div>
        <div class="type-btn" id="tb-add" onclick="setType('add')">追加採購</div>
      </div>
    </div>
    <div class="main">
      <div class="sidebar" id="sidebar"></div>
      <div class="prod-pane" id="prod-pane">
        <div class="prod-grid" id="prod-grid"></div>
      </div>
      <div class="cart-panel">
        <div class="cart-header">
          <div class="cart-title">已選品項</div>
          <div class="cart-cnt" id="cart-cnt"></div>
        </div>
        <div class="cart-list" id="cart-list"><div class="cart-empty">尚未選購任何品項</div></div>
        <div class="cart-footer">
          <div class="total-row">
            <span class="total-lbl">產品小計（未稅）</span>
            <span class="total-num" id="cart-total">$0</span>
          </div>
          <div class="cart-note">安裝工資、軟體設定費及現場報價項目另計。</div>
          <button class="submit-btn" onclick="submitOrder()">確認送出並產生採購單 →</button>
        </div>
      </div>
    </div>
  </div>

  <!-- RESULT PAGE -->
  <div id="result-page">
    <div class="result-box" id="result-box">
      <div class="result-header">
        <h2>採購單確認</h2>
        <p id="result-subtitle"></p>
      </div>
      <div class="result-info" id="result-info"></div>
      <table class="result-table">
        <thead><tr><th>品名</th><th>規格</th><th>單位</th><th>單價</th><th>數量</th><th>小計</th><th>備註</th></tr></thead>
        <tbody id="result-tbody"></tbody>
      </table>
      <div class="result-total">
        <span class="result-total-lbl">產品合計（未稅，不含待報價項目）</span>
        <span class="result-total-num" id="result-total"></span>
      </div>
      <div class="email-status" id="email-status">✓ 採購單已寄送至 service@playmood.com.tw 備份</div>
      <div class="dl-row">
        <button class="dl-btn primary" onclick="downloadExcel()">⬇ 下載 Excel 採購單</button>
        <button class="dl-btn" onclick="downloadPDF()">⬇ 下載 PDF 採購單</button>
      </div>
      <div style="text-align:center">
        <button class="back-btn" onclick="goBack()">← 返回修改</button>
      </div>
    </div>
  </div>
</div>

<script>
let cart = {}, itemNotes = {}, tbdNotes = {}, curCat = CATS_ORDER[0], orderType = 'new';
let orderData = null;

function setType(t){
  orderType = t;
  document.getElementById('tb-new').classList.toggle('on', t==='new');
  document.getElementById('tb-add').classList.toggle('on', t==='add');
}

function buildSidebar(){
  const sb = document.getElementById('sidebar');
  sb.innerHTML = CATS_ORDER.map(c => {
    const count = PRODUCTS.filter(p => p.cat===c && (cart[p.id]||0)>0).length;
    return `<button class="cat-btn${c===curCat?' on':''}" onclick="switchCat('${c}')">
      ${CAT_LABELS[c]}${count>0?`<span class="cat-count">${count}</span>`:''}
    </button>`;
  }).join('');
}

function switchCat(id){ curCat=id; buildSidebar(); renderGrid(); }

function renderGrid(){
  const prods = PRODUCTS.filter(p => p.cat===curCat);
  document.getElementById('prod-grid').innerHTML = prods.map(p => {
    const q = cart[p.id]||0;
    const sel = q>0;
    const note = itemNotes[p.id]||'';
    const tbn = tbdNotes[p.id]||'';
    const imgHtml = p.img
      ? `<img src="${p.img}" alt="${p.name}" loading="lazy">`
      : `<div class="pimg-placeholder">📦</div>`;
    const priceHtml = p.tbd
      ? `<div class="ptbd">需洽談報價</div>`
      : `<div class="pprice">$${p.price.toLocaleString()}</div>`;
    const tbdTag = p.tbd ? `<span class="tag-tbd">需洽談</span>` : '';
    const specTag = p.hint && !p.tbd ? `<span class="tag-spec">需填規格</span>` : '';
    const tbdArea = p.tbd
      ? `<textarea class="note-inp" rows="2" placeholder="需求說明：${p.hint||'請描述您的需求'}" oninput="setTbd(${p.id},this.value)">${tbn}</textarea>` : '';
    const noteArea = sel && !p.tbd
      ? `<textarea class="note-inp" rows="2" placeholder="${p.hint||'備註（顏色、規格等）'}" oninput="setNote(${p.id},this.value)">${note}</textarea>` : '';
    return `<div class="pcard${sel?' sel':''}" id="pc-${p.id}">
      <div class="pimg">${imgHtml}</div>
      <div class="pbody">
        <div>${tbdTag}${specTag}</div>
        <div class="pname">${p.name}</div>
        <div class="pspec">${p.spec}</div>
        ${priceHtml}
        <div class="qty-row">
          <button class="qbtn" onclick="chg(${p.id},-1)">−</button>
          <span class="qnum" id="qn-${p.id}">${q}</span>
          <button class="qbtn" onclick="chg(${p.id},1)">＋</button>
        </div>
        ${tbdArea}${noteArea}
      </div>
    </div>`;
  }).join('');
}

function chg(id, d){
  cart[id] = Math.max(0, (cart[id]||0)+d);
  renderGrid(); buildSidebar(); renderCart();
}
function setNote(id,v){ itemNotes[id]=v; }
function setTbd(id,v){ tbdNotes[id]=v; }

function renderCart(){
  const sel = PRODUCTS.filter(p=>(cart[p.id]||0)>0);
  const list = document.getElementById('cart-list');
  document.getElementById('cart-cnt').textContent = sel.length ? `共 ${sel.length} 品項` : '';
  if(!sel.length){ list.innerHTML='<div class="cart-empty">尚未選購任何品項</div>'; document.getElementById('cart-total').textContent='$0'; return; }
  let total = 0;
  list.innerHTML = sel.map(p=>{
    const q = cart[p.id], lt = p.price ? p.price*q : null;
    if(lt) total += lt;
    const n = itemNotes[p.id]||'', tn = tbdNotes[p.id]||'';
    return `<div class="citem">
      <div class="cname">${p.name} <span class="cqty">×${q}</span></div>
      ${n?`<div class="cnote">備註：${n}</div>`:''}
      ${tn?`<div class="cnote">需求：${tn}</div>`:''}
      <div class="crow">
        <span class="cprice">${lt?'$'+lt.toLocaleString():'待報價'}</span>
        <span class="cremove" onclick="rmv(${p.id})">移除</span>
      </div>
    </div>`;
  }).join('');
  document.getElementById('cart-total').textContent = '$'+total.toLocaleString()+(sel.some(p=>p.tbd)?'+待報':'');
}

function rmv(id){ cart[id]=0; renderGrid(); buildSidebar(); renderCart(); }

function submitOrder(){
  const name = document.getElementById('f-name').value.trim();
  if(!name){alert('請填寫採購人姓名');return;}
  const sel = PRODUCTS.filter(p=>(cart[p.id]||0)>0);
  if(!sel.length){alert('請先選購品項');return;}
  const contact = document.getElementById('f-contact').value.trim();
  const project = document.getElementById('f-project').value.trim();
  const globalNote = document.getElementById('f-global-note').value.trim();
  const date = new Date().toLocaleDateString('zh-TW');
  let total = 0;
  const items = sel.map(p=>{
    const q = cart[p.id], lt = p.price ? p.price*q : null;
    if(lt) total += lt;
    return {
      name: p.name, spec: p.spec, unit: p.unit,
      price: p.price, qty: q,
      subtotal: lt, tbd: p.tbd,
      note: itemNotes[p.id]||'', tbdNote: tbdNotes[p.id]||''
    };
  });
  orderData = { name, contact, project, globalNote, date, orderType, items, total };
  showResult();
  sendEmail();
}

function showResult(){
  document.getElementById('order-page').style.display='none';
  const rp = document.getElementById('result-page');
  rp.style.display='flex';
  const d = orderData;
  document.getElementById('result-subtitle').textContent = `${d.date} ｜ ${d.orderType==='new'?'首次採購':'追加採購'}`;
  document.getElementById('result-info').innerHTML = `
    <div class="ri-row"><span class="ri-label">採購人</span><span class="ri-val">${d.name}</span></div>
    <div class="ri-row"><span class="ri-label">聯絡方式</span><span class="ri-val">${d.contact||'-'}</span></div>
    <div class="ri-row"><span class="ri-label">案件名稱</span><span class="ri-val">${d.project||'-'}</span></div>
    <div class="ri-row"><span class="ri-label">備註</span><span class="ri-val">${d.globalNote||'-'}</span></div>
  `;
  const tbody = document.getElementById('result-tbody');
  tbody.innerHTML = d.items.map(it=>`<tr>
    <td>${it.name}</td>
    <td style="font-size:10px;color:#888">${it.spec}</td>
    <td>${it.unit}</td>
    <td>${it.tbd?'待報價':'$'+it.price.toLocaleString()}</td>
    <td style="text-align:center">${it.qty}</td>
    <td>${it.subtotal?'$'+it.subtotal.toLocaleString():'待報價'}</td>
    <td style="font-size:10px;color:#888">${it.note||it.tbdNote||''}</td>
  </tr>`).join('');
  document.getElementById('result-total').textContent = '$'+d.total.toLocaleString()+(d.items.some(i=>i.tbd)?'＋待報':'');
}

function goBack(){
  document.getElementById('result-page').style.display='none';
  document.getElementById('order-page').style.display='block';
}

// ============ EMAIL (FormSubmit) ============
function sendEmail(){
  const d = orderData;
  let body = `【玩物智所採購單】\n採購人：${d.name}　聯絡：${d.contact||'未填'}\n案件：${d.project||'未填'}　類型：${d.orderType==='new'?'首次採購':'追加採購'}\n備註：${d.globalNote||'無'}\n${'─'.repeat(30)}\n`;
  d.items.forEach(it=>{
    body += `• ${it.name} ×${it.qty}　${it.subtotal?'$'+it.subtotal.toLocaleString():'待報價'}\n`;
    if(it.note) body += `  備註：${it.note}\n`;
    if(it.tbdNote) body += `  需求說明：${it.tbdNote}\n`;
  });
  body += `${'─'.repeat(30)}\n產品合計（未稅）：$${d.total.toLocaleString()}${d.items.some(i=>i.tbd)?'＋待報':''}`;

  const formData = new FormData();
  formData.append('name', d.name);
  formData.append('email', 'service@playmood.com.tw');
  formData.append('_subject', `【玩物智所採購單】${d.name} / ${d.project||'未填案件'} / ${d.date}`);
  formData.append('message', body);
  formData.append('_captcha', 'false');
  formData.append('_template', 'table');

  fetch('https://formsubmit.co/service@playmood.com.tw', {
    method: 'POST',
    body: formData
  }).then(()=>{
    const el = document.getElementById('email-status');
    el.style.display='block';
    el.textContent = '✓ 採購單摘要已寄送至 service@playmood.com.tw 備份';
  }).catch(()=>{
    const el = document.getElementById('email-status');
    el.style.display='block';
    el.style.background='#FFF3CD';
    el.style.borderColor='#FFAB00';
    el.style.color='#7A5C00';
    el.textContent = '提醒：郵件備份未成功，請手動儲存 PDF/Excel 檔案。';
  });
}

// ============ EXCEL DOWNLOAD ============
function downloadExcel(){
  const d = orderData;
  const wb = XLSX.utils.book_new();
  const rows = [
    ['玩物智所 Playmood Studio｜產品採購單','','','','','',''],
    ['採購人：'+d.name,'','聯絡方式：'+d.contact,'','案件名稱：'+d.project,'',''],
    ['採購日期：'+d.date,'','採購類型：'+(d.orderType==='new'?'首次採購':'追加採購'),'','備註：'+d.globalNote,'',''],
    ['','','','','','',''],
    ['品名','規格','連接協議','單位','單價(未稅)','數量','小計','備註'],
  ];
  d.items.forEach(it=>{
    rows.push([
      it.name, it.spec, '-', it.unit,
      it.tbd?'待報價':it.price,
      it.qty,
      it.subtotal||'待報價',
      it.note||it.tbdNote||''
    ]);
  });
  rows.push(['','','','','','','','']);
  rows.push(['產品合計（未稅）','','','','','','$'+d.total.toLocaleString()+(d.items.some(i=>i.tbd)?'＋待報':''),'']);
  rows.push(['','','','','','','','']);
  rows.push(['※ 安裝工資、軟體設定費及需洽談之項目另計。','','','','','','','']);
  rows.push(['客戶確認簽名：____________________　　日期：____________________　　玩物智所確認：____________________','','','','','','','']);

  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:40},{wch:16},{wch:12},{wch:6},{wch:12},{wch:6},{wch:12},{wch:30}];
  XLSX.utils.book_append_sheet(wb, ws, '採購單');
  const fname = `玩物智所採購單_${d.name}_${d.date.replace(/\//g,'')}.xlsx`;
  XLSX.writeFile(wb, fname);
}

// ============ PDF DOWNLOAD ============
function downloadPDF(){
  const { jsPDF } = window.jspdf;
  const d = orderData;
  const doc = new jsPDF({ orientation:'p', unit:'mm', format:'a4' });
  
  // Yellow header
  doc.setFillColor(255,230,0);
  doc.rect(0,0,210,28,'F');
  doc.setFont('helvetica','bold');
  doc.setFontSize(16);
  doc.setTextColor(26,26,26);
  doc.text('Playmood Studio | Product Order Form', 14, 12);
  doc.setFontSize(10);
  doc.setFont('helvetica','normal');
  doc.text('www.playmood.com.tw   service@playmood.com.tw', 14, 20);
  
  doc.setTextColor(26,26,26);
  doc.setFontSize(9);
  let y = 34;
  const info = [
    ['採購人 / Name', d.name, '聯絡 / Contact', d.contact||'-'],
    ['案件 / Project', d.project||'-', '日期 / Date', d.date],
    ['類型 / Type', d.orderType==='new'?'首次採購 First Order':'追加採購 Additional', '備註 / Note', d.globalNote||'-'],
  ];
  info.forEach(row=>{
    doc.setFont('helvetica','bold'); doc.text(row[0]+': ', 14, y);
    doc.setFont('helvetica','normal'); doc.text(String(row[1]), 45, y);
    doc.setFont('helvetica','bold'); doc.text(row[2]+': ', 110, y);
    doc.setFont('helvetica','normal'); doc.text(String(row[3]), 135, y);
    y += 5;
  });
  y += 3;

  const tableRows = d.items.map(it=>[
    it.name.substring(0,32),
    it.unit,
    it.tbd?'TBD':'$'+it.price.toLocaleString(),
    String(it.qty),
    it.subtotal?'$'+it.subtotal.toLocaleString():'TBD',
    (it.note||it.tbdNote||'').substring(0,20)
  ]);

  doc.autoTable({
    startY: y,
    head: [['品名 Name','單位','單價','數量','小計','備註']],
    body: tableRows,
    styles: { fontSize:8, cellPadding:2.5 },
    headStyles: { fillColor:[26,26,26], textColor:[255,230,0], fontStyle:'bold' },
    alternateRowStyles: { fillColor:[248,248,248] },
    columnStyles: {
      0:{cellWidth:68}, 1:{cellWidth:12,halign:'center'},
      2:{cellWidth:22,halign:'right'}, 3:{cellWidth:12,halign:'center'},
      4:{cellWidth:22,halign:'right'}, 5:{cellWidth:42}
    },
    margin:{left:14,right:14},
  });

  const finalY = doc.lastAutoTable.finalY + 8;
  doc.setFillColor(255,230,0);
  doc.rect(14, finalY-4, 182, 10, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text('Product Total (excl. tax):', 16, finalY+2.5);
  doc.text('$'+d.total.toLocaleString()+(d.items.some(i=>i.tbd)?' + TBD':''), 160, finalY+2.5, {align:'right'});

  const noteY = finalY + 16;
  doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.setTextColor(128);
  doc.text('* Installation labour, software setup and on-site quotation items are not included in the above total.', 14, noteY);
  doc.text('* "TBD" items require on-site assessment; please provide requirements in the notes column.', 14, noteY+4);
  
  const sigY = noteY + 12;
  doc.setTextColor(26,26,26); doc.setFontSize(8);
  doc.text('Customer Signature: ________________________  Date: __________  Playmood Confirmed: ________________________', 14, sigY);

  const fname = `玩物智所採購單_${d.name}_${d.date.replace(/\//g,'')}.pdf`;
  doc.save(fname);
}
