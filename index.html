<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>玩物智所｜產品採購單</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,'Microsoft JhengHei',sans-serif;background:#F2F2F2;color:#1A1A1A;font-size:13px}
/* HEADER */
.hdr{background:#FFE600;padding:13px 20px 11px;display:flex;align-items:center;gap:16px;border-bottom:3px solid #1A1A1A;position:sticky;top:0;z-index:100}
.hdr-logo{font-size:19px;font-weight:900;letter-spacing:.3px}
.hdr-sub{font-size:10px;color:#666;margin-top:1px}
.hdr-cartbadge{margin-left:auto;background:#1A1A1A;color:#FFE600;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;cursor:pointer;white-space:nowrap}
/* INFO */
.info-bar{background:#fff;border-bottom:2px solid #FFE600;padding:14px 20px}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.info-full{grid-column:1/-1}
.f label{display:block;font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.f input{width:100%;padding:7px 10px;border:1.5px solid #DDD;border-radius:4px;font-size:13px;font-family:inherit;background:#FAFAFA}
.f input:focus{outline:none;border-color:#FFE600;background:#fff}
.type-row{display:flex;gap:8px;margin-top:10px}
.tbtn{flex:1;padding:8px;border:2px solid #DDD;border-radius:4px;background:#fff;cursor:pointer;font-size:12px;font-weight:700;text-align:center;color:#AAA;transition:all .15s}
.tbtn.on{border-color:#1A1A1A;background:#1A1A1A;color:#FFE600}
/* LAYOUT */
.layout{display:flex;height:calc(100vh - 170px);overflow:hidden}
/* SIDEBAR */
.sidebar{width:148px;flex-shrink:0;background:#1A1A1A;overflow-y:auto;overflow-x:hidden}
.sidebar::-webkit-scrollbar{width:4px}.sidebar::-webkit-scrollbar-thumb{background:#333}
.scat{display:block;width:100%;padding:10px 12px;border:none;background:transparent;color:#AAA;text-align:left;cursor:pointer;font-size:11px;font-weight:700;border-bottom:1px solid #222;transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scat:hover{background:#2A2A2A;color:#FFE600}
.scat.on{background:#FFE600;color:#1A1A1A}
.scat .badge{float:right;background:#333;color:#888;font-size:9px;padding:1px 5px;border-radius:10px;margin-top:1px}
.scat.on .badge{background:#1A1A1A;color:#FFE600}
/* PRODUCTS */
.prod-pane{flex:1;overflow-y:auto;padding:12px}
.prod-pane::-webkit-scrollbar{width:5px}.prod-pane::-webkit-scrollbar-thumb{background:#CCC}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:9px}
.pcard{background:#fff;border:1.5px solid #E8E8E8;border-radius:6px;overflow:hidden;transition:border-color .15s}
.pcard:hover{border-color:#CCC}
.pcard.sel{border-color:#FFE600;box-shadow:0 0 0 1.5px #FFE600}
.pimg{height:84px;background:#F6F6F6;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid #EEE}
.pimg img{max-width:100%;max-height:100%;object-fit:contain}
.nophoto{font-size:28px;color:#CCC}
.pbody{padding:8px 9px 10px}
.pname{font-size:11px;font-weight:700;line-height:1.4;margin-bottom:3px}
.pspec{font-size:10px;color:#999;line-height:1.3;margin-bottom:5px}
.pprice{font-size:13px;font-weight:900;margin-bottom:6px}
.ptbd{font-size:10px;color:#999;font-style:italic;margin-bottom:6px}
.tag-y{display:inline-block;background:#FFE600;color:#1A1A1A;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;margin-bottom:3px}
.tag-k{display:inline-block;background:#1A1A1A;color:#FFE600;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;margin-bottom:3px;margin-left:3px}
.qrow{display:flex;align-items:center;gap:6px}
.qbtn{width:26px;height:26px;border:1.5px solid #CCC;border-radius:4px;background:#fff;cursor:pointer;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .1s}
.qbtn:hover{background:#FFE600;border-color:#1A1A1A}
.qnum{min-width:22px;text-align:center;font-size:13px;font-weight:700}
.ninp{width:100%;margin-top:6px;padding:5px 7px;border:1.5px solid #E0E0E0;border-radius:4px;font-size:11px;font-family:inherit;resize:none;background:#FFFDF0}
.ninp:focus{outline:none;border-color:#FFE600}
/* CART PANEL */
.cart{width:268px;flex-shrink:0;background:#1A1A1A;display:flex;flex-direction:column}
.cart-hdr{padding:13px 15px 9px;border-bottom:1px solid #2A2A2A}
.cart-title{font-size:13px;font-weight:700;color:#FFE600}
.cart-cnt{font-size:10px;color:#666;margin-top:2px}
.cart-body{flex:1;overflow-y:auto;padding:6px 15px}
.cart-body::-webkit-scrollbar{width:3px}.cart-body::-webkit-scrollbar-thumb{background:#333}
.cempty{color:#555;font-size:12px;padding:20px 0;text-align:center}
.ci{padding:7px 0;border-bottom:1px solid #222}
.ci:last-child{border-bottom:none}
.ciname{font-size:11px;color:#CCC;line-height:1.4}
.ciqty{color:#666;font-size:10px}
.cinote{font-size:10px;color:#555;margin-top:2px;font-style:italic}
.cirow{display:flex;justify-content:space-between;align-items:center;margin-top:3px}
.ciprice{font-size:12px;font-weight:700;color:#FFE600}
.cidel{font-size:10px;color:#444;cursor:pointer}
.cidel:hover{color:#FF4444}
.cart-foot{padding:11px 15px;border-top:1px solid #2A2A2A}
.trow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.tlbl{font-size:11px;color:#666}
.tnum{font-size:20px;font-weight:900;color:#FFE600}
.tnote{font-size:10px;color:#444;margin-bottom:10px;line-height:1.5}
.sbtn{width:100%;padding:11px;border:none;border-radius:5px;background:#FFE600;color:#1A1A1A;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.sbtn:hover{background:#EED800}
/* LOADING */
#loading{position:fixed;inset:0;background:#1A1A1A;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999}
#loading h1{color:#FFE600;font-size:22px;font-weight:900;margin-bottom:8px}
#loading p{color:#888;font-size:13px}
.spinner{width:36px;height:36px;border:3px solid #333;border-top:3px solid #FFE600;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
/* RESULT */
#result{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;overflow-y:auto;padding:30px 16px}
.rbox{background:#fff;border-radius:8px;max-width:720px;margin:0 auto;overflow:hidden}
.rhdr{background:#FFE600;padding:20px 28px}
.rhdr h2{font-size:20px;font-weight:900}
.rhdr p{font-size:11px;color:#666;margin-top:3px}
.rbody{padding:24px 28px}
.rinfo{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:20px;padding-bottom:16px;border-bottom:1.5px solid #EEE}
.ri{font-size:12px}.ri b{color:#888;font-weight:400;margin-right:4px}
.rtable{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:16px}
.rtable th{background:#1A1A1A;color:#FFE600;padding:7px 9px;text-align:left;font-size:10px;font-weight:700}
.rtable td{padding:6px 9px;border-bottom:1px solid #F0F0F0;vertical-align:top}
.rtable tr:nth-child(even) td{background:#FAFAFA}
.rtotal{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-top:2px solid #1A1A1A;margin-bottom:16px}
.rtlbl{font-size:12px;color:#888}
.rtnum{font-size:22px;font-weight:900}
.dlrow{display:flex;gap:10px;margin-bottom:14px}
.dlbtn{flex:1;padding:11px;border:2px solid #1A1A1A;border-radius:5px;background:#fff;cursor:pointer;font-size:12px;font-weight:700;text-align:center;font-family:inherit;transition:all .15s}
.dlbtn:hover{background:#1A1A1A;color:#FFE600}
.dlbtn.pri{background:#FFE600;border-color:#FFE600}
.dlbtn.pri:hover{background:#EED800;color:#1A1A1A}
.estatus{background:#E1F5EE;border:1px solid #5DCAA5;color:#085041;border-radius:4px;padding:9px 14px;font-size:11px;text-align:center;margin-bottom:12px}
.estatus.warn{background:#FFF8E1;border-color:#FFC107;color:#7A5C00}
.backbtn{width:100%;padding:9px;border:1.5px solid #CCC;border-radius:4px;background:transparent;cursor:pointer;font-size:12px;color:#888;font-family:inherit}
.backbtn:hover{color:#1A1A1A;border-color:#1A1A1A}
/* MOBILE */
@media(max-width:680px){
  .layout{height:auto;flex-direction:column}
  .sidebar{width:100%;display:flex;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;height:auto}
  .scat{border-bottom:none;border-right:1px solid #222;padding:9px 11px;flex-shrink:0}
  .cart{width:100%}
  .info-grid{grid-template-columns:1fr 1fr}
  .dlrow{flex-direction:column}
  .rinfo{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <h1>玩物智所</h1>
  <p>產品資料載入中…</p>
</div>

<div id="app" style="display:none">
  <div class="hdr">
    <div>
      <div class="hdr-logo">玩物智所 PLAYMOOD STUDIO</div>
      <div class="hdr-sub">產品採購單系統 Product Order Form</div>
    </div>
    <div class="hdr-cartbadge" onclick="scrollToCart()" id="hdr-badge" style="display:none">購物車 <span id="hdr-cnt">0</span></div>
  </div>

  <div class="info-bar">
    <div class="info-grid">
      <div class="f"><label>採購人姓名 *</label><input id="f-name" placeholder="王小明"></div>
      <div class="f"><label>聯絡方式</label><input id="f-contact" placeholder="電話 / LINE"></div>
      <div class="f"><label>案件名稱 / 工地地址</label><input id="f-project" placeholder="例：忠孝東路住宅"></div>
      <div class="f info-full"><label>備註 / 特殊需求</label><input id="f-note" placeholder="配合工期、風格偏好、顏色系統偏好…"></div>
    </div>
    <div class="type-row">
      <div class="tbtn on" id="tb-new" onclick="setType('new')">首次採購</div>
      <div class="tbtn" id="tb-add" onclick="setType('add')">追加採購</div>
    </div>
  </div>

  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="prod-pane" id="prod-pane"><div class="pgrid" id="pgrid"></div></div>
    <div class="cart" id="cart-panel">
      <div class="cart-hdr">
        <div class="cart-title">已選品項</div>
        <div class="cart-cnt" id="cart-cnt"></div>
      </div>
      <div class="cart-body" id="cart-body"><div class="cempty">尚未選購任何品項</div></div>
      <div class="cart-foot">
        <div class="trow"><span class="tlbl">產品小計（未稅）</span><span class="tnum" id="cart-total">$0</span></div>
        <div class="tnote">安裝工資、軟體設定費及現場報價項目另計。</div>
        <button class="sbtn" onclick="submitOrder()">確認送出並產生採購單 →</button>
      </div>
    </div>
  </div>
</div>

<!-- RESULT MODAL -->
<div id="result">
  <div class="rbox">
    <div class="rhdr">
      <h2>採購單確認</h2>
      <p id="r-sub"></p>
    </div>
    <div class="rbody">
      <div class="rinfo" id="r-info"></div>
      <table class="rtable">
        <thead><tr><th>#</th><th>品名</th><th>規格</th><th>單位</th><th>單價</th><th>數量</th><th>小計</th><th>備註</th></tr></thead>
        <tbody id="r-tbody"></tbody>
      </table>
      <div class="rtotal">
        <span class="rtlbl">產品合計（未稅，不含待報價項目）</span>
        <span class="rtnum" id="r-total"></span>
      </div>
      <div class="estatus" id="email-status" style="display:none"></div>
      <div class="dlrow">
        <button class="dlbtn pri" onclick="dlExcel()">⬇ 下載 Excel 採購單</button>
        <button class="dlbtn" onclick="dlPDF()">⬇ 下載 PDF 採購單</button>
      </div>
      <button class="backbtn" onclick="closeResult()">← 返回修改採購單</button>
    </div>
  </div>
</div>

<script>
// ── State ──
let PRODUCTS = [], CAT_LABELS = {}, CATS_ORDER = [];
let cart = {}, itemNotes = {}, tbdNotes = {}, curCat = '', orderType = 'new', orderData = null;

// ── Load data ──
async function init() {
  try {
    const [pRes, mRes] = await Promise.all([
      fetch('products.json'), fetch('meta.json')
    ]);
    PRODUCTS = await pRes.json();
    const meta = await mRes.json();
    CAT_LABELS = meta.cat_labels;
    CATS_ORDER = meta.cats_order;
    curCat = CATS_ORDER[0];
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    buildSidebar(); renderGrid(); renderCart();
  } catch(e) {
    document.getElementById('loading').innerHTML = '<h1 style="color:#FF4444">載入失敗</h1><p style="color:#888">請確認 products.json 和 meta.json 在同一目錄</p>';
  }
}

// ── Type toggle ──
function setType(t) {
  orderType = t;
  document.getElementById('tb-new').classList.toggle('on', t==='new');
  document.getElementById('tb-add').classList.toggle('on', t==='add');
}

// ── Sidebar ──
function buildSidebar() {
  document.getElementById('sidebar').innerHTML = CATS_ORDER.map(c => {
    const cnt = PRODUCTS.filter(p=>p.cat===c && (cart[p.id]||0)>0).length;
    return `<button class="scat${c===curCat?' on':''}" onclick="switchCat('${c}')">
      ${CAT_LABELS[c]}${cnt>0?`<span class="badge">${cnt}</span>`:''}
    </button>`;
  }).join('');
}

function switchCat(id) { curCat=id; buildSidebar(); renderGrid(); }

// ── Products ──
function renderGrid() {
  const prods = PRODUCTS.filter(p=>p.cat===curCat);
  document.getElementById('pgrid').innerHTML = prods.map(p => {
    const q = cart[p.id]||0, sel = q>0;
    const n = itemNotes[p.id]||'', tn = tbdNotes[p.id]||'';
    const imgH = p.img
      ? `<img src="${p.img}" alt="" loading="lazy">`
      : `<div class="nophoto">📦</div>`;
    const priceH = p.tbd
      ? `<div class="ptbd">需洽談報價</div>`
      : `<div class="pprice">$${p.price.toLocaleString()}</div>`;
    const tags = (p.tbd?`<span class="tag-y">需洽談</span>`:'')+
                 (p.hint&&!p.tbd?`<span class="tag-k">需填規格</span>`:'');
    const tbdA = p.tbd ? `<textarea class="ninp" rows="2" placeholder="需求說明：${p.hint||'請描述您的需求'}" oninput="setTbd(${p.id},this.value)">${tn}</textarea>` : '';
    const noteA = sel&&!p.tbd ? `<textarea class="ninp" rows="2" placeholder="${p.hint||'備註（顏色、規格等）'}" oninput="setNote(${p.id},this.value)">${n}</textarea>` : '';
    return `<div class="pcard${sel?' sel':''}" id="pc-${p.id}">
      <div class="pimg">${imgH}</div>
      <div class="pbody">
        ${tags?`<div>${tags}</div>`:''}
        <div class="pname">${p.name}</div>
        <div class="pspec">${p.spec}${p.proto&&p.proto!=='-'?'｜'+p.proto:''}</div>
        ${priceH}
        <div class="qrow">
          <button class="qbtn" onclick="chg(${p.id},-1)">−</button>
          <span class="qnum" id="qn-${p.id}">${q}</span>
          <button class="qbtn" onclick="chg(${p.id},1)">＋</button>
        </div>
        ${tbdA}${noteA}
      </div>
    </div>`;
  }).join('');
}

function chg(id, d) {
  cart[id] = Math.max(0,(cart[id]||0)+d);
  renderGrid(); buildSidebar(); renderCart();
}
function setNote(id,v){ itemNotes[id]=v; }
function setTbd(id,v){ tbdNotes[id]=v; }

// ── Cart ──
function renderCart() {
  const sel = PRODUCTS.filter(p=>(cart[p.id]||0)>0);
  const body = document.getElementById('cart-body');
  const badge = document.getElementById('hdr-badge');
  document.getElementById('cart-cnt').textContent = sel.length?`共 ${sel.length} 品項`:'';
  document.getElementById('hdr-cnt').textContent = sel.length;
  badge.style.display = sel.length?'block':'none';
  if(!sel.length){ body.innerHTML='<div class="cempty">尚未選購任何品項</div>'; document.getElementById('cart-total').textContent='$0'; return; }
  let total=0;
  body.innerHTML = sel.map(p=>{
    const q=cart[p.id], lt=p.price?p.price*q:null;
    if(lt) total+=lt;
    const n=itemNotes[p.id]||'', tn=tbdNotes[p.id]||'';
    return `<div class="ci">
      <div class="ciname">${p.name} <span class="ciqty">×${q}</span></div>
      ${n?`<div class="cinote">備註：${n}</div>`:''}
      ${tn?`<div class="cinote">需求：${tn}</div>`:''}
      <div class="cirow">
        <span class="ciprice">${lt?'$'+lt.toLocaleString():'待報價'}</span>
        <span class="cidel" onclick="rmv(${p.id})">✕ 移除</span>
      </div>
    </div>`;
  }).join('');
  document.getElementById('cart-total').textContent='$'+total.toLocaleString()+(sel.some(p=>p.tbd)?'+待報':'');
}
function rmv(id){ cart[id]=0; renderGrid(); buildSidebar(); renderCart(); }
function scrollToCart(){ document.getElementById('cart-panel').scrollIntoView({behavior:'smooth'}); }

// ── Submit ──
function submitOrder() {
  const name = document.getElementById('f-name').value.trim();
  if(!name){ alert('請填寫採購人姓名'); return; }
  const sel = PRODUCTS.filter(p=>(cart[p.id]||0)>0);
  if(!sel.length){ alert('請先選購品項'); return; }
  const contact=document.getElementById('f-contact').value.trim();
  const project=document.getElementById('f-project').value.trim();
  const note=document.getElementById('f-note').value.trim();
  const date=new Date().toLocaleDateString('zh-TW');
  let total=0;
  const items=sel.map(p=>{
    const q=cart[p.id], lt=p.price?p.price*q:null;
    if(lt) total+=lt;
    return { name:p.name, spec:p.spec, unit:p.unit, price:p.price, qty:q, subtotal:lt, tbd:p.tbd, note:itemNotes[p.id]||'', tbdNote:tbdNotes[p.id]||'' };
  });
  orderData={name,contact,project,note,date,orderType,items,total};
  showResult(); sendEmail();
}

// ── Result ──
function showResult() {
  const d=orderData;
  document.getElementById('r-sub').textContent=`${d.date}｜${d.orderType==='new'?'首次採購':'追加採購'}`;
  document.getElementById('r-info').innerHTML=`
    <div class="ri"><b>採購人</b>${d.name}</div>
    <div class="ri"><b>聯絡</b>${d.contact||'-'}</div>
    <div class="ri"><b>案件</b>${d.project||'-'}</div>
    <div class="ri"><b>備註</b>${d.note||'-'}</div>`;
  document.getElementById('r-tbody').innerHTML=d.items.map((it,i)=>`<tr>
    <td style="color:#AAA">${i+1}</td>
    <td>${it.name}</td>
    <td style="font-size:10px;color:#999">${it.spec}</td>
    <td>${it.unit}</td>
    <td>${it.tbd?'待報價':'$'+it.price.toLocaleString()}</td>
    <td style="text-align:center">${it.qty}</td>
    <td>${it.subtotal?'$'+it.subtotal.toLocaleString():'待報價'}</td>
    <td style="font-size:10px;color:#999">${it.note||it.tbdNote||''}</td>
  </tr>`).join('');
  document.getElementById('r-total').textContent='$'+d.total.toLocaleString()+(d.items.some(i=>i.tbd)?'＋待報':'');
  document.getElementById('email-status').style.display='none';
  document.getElementById('result').style.display='block';
}
function closeResult(){ document.getElementById('result').style.display='none'; }

// ── Email ──
function sendEmail() {
  const d=orderData;
  let body=`【玩物智所採購單】\n採購人：${d.name}　聯絡：${d.contact||'未填'}\n案件：${d.project||'未填'}　類型：${d.orderType==='new'?'首次採購':'追加採購'}\n備註：${d.note||'無'}\n${'─'.repeat(28)}\n`;
  d.items.forEach(it=>{
    body+=`• ${it.name} ×${it.qty}　${it.subtotal?'$'+it.subtotal.toLocaleString():'待報價'}\n`;
    if(it.note) body+=`  備註：${it.note}\n`;
    if(it.tbdNote) body+=`  需求：${it.tbdNote}\n`;
  });
  body+=`${'─'.repeat(28)}\n合計：$${d.total.toLocaleString()}${d.items.some(i=>i.tbd)?'＋待報':''}`;
  const fd=new FormData();
  fd.append('name',d.name);
  fd.append('email','service@playmood.com.tw');
  fd.append('_subject',`【採購單】${d.name} / ${d.project||'未填'} / ${d.date}`);
  fd.append('message',body);
  fd.append('_captcha','false');
  fetch('https://formsubmit.co/service@playmood.com.tw',{method:'POST',body:fd})
    .then(()=>showEmailStatus(true)).catch(()=>showEmailStatus(false));
}
function showEmailStatus(ok) {
  const el=document.getElementById('email-status');
  el.style.display='block';
  if(ok){ el.className='estatus'; el.textContent='✓ 採購單摘要已寄送至 service@playmood.com.tw 備份'; }
  else { el.className='estatus warn'; el.textContent='提醒：郵件備份未成功，請下載 PDF 或 Excel 自行儲存。'; }
}

// ── Excel ──
function dlExcel() {
  const d=orderData;
  const rows=[
    ['玩物智所 Playmood Studio｜產品採購單','','','','','','',''],
    ['採購人：'+d.name,'','聯絡：'+d.contact,'','案件：'+d.project,'','日期：'+d.date,''],
    ['採購類型：'+(d.orderType==='new'?'首次採購':'追加採購'),'','備註：'+d.note,'','','','',''],
    ['','','','','','','',''],
    ['#','品名','規格','連接協議','單位','單價(未稅)','數量','小計','備註'],
  ];
  d.items.forEach((it,i)=>rows.push([i+1,it.name,it.spec,'-',it.unit,it.tbd?'待報價':it.price,it.qty,it.subtotal||'待報價',it.note||it.tbdNote||'']));
  rows.push(['','','','','','','','','']);
  rows.push(['','','','','','產品合計（未稅）','','$'+d.total.toLocaleString()+(d.items.some(i=>i.tbd)?'＋待報':''),'']);
  rows.push(['','','','','','','','','']);
  rows.push(['※ 安裝工資、軟體設定費及需洽談項目另計。','','','','','','','','']);
  rows.push(['客戶簽名：________________________　　日期：__________　　玩物智所確認：________________________','','','','','','','','']);
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:4},{wch:38},{wch:16},{wch:10},{wch:6},{wch:12},{wch:6},{wch:12},{wch:28}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'採購單');
  XLSX.writeFile(wb,`玩物智所採購單_${d.name}_${d.date.replace(/\//g,'')}.xlsx`);
}

// ── PDF ──
function dlPDF() {
  const {jsPDF}=window.jspdf, d=orderData;
  const doc=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
  doc.setFillColor(255,230,0); doc.rect(0,0,210,26,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(26,26,26);
  doc.text('PLAYMOOD STUDIO | Product Order Form',14,11);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(100,100,100);
  doc.text('www.playmood.com.tw   service@playmood.com.tw',14,19);
  let y=32; doc.setFontSize(9); doc.setTextColor(26,26,26);
  [['採購人',d.name,'聯絡',d.contact||'-'],
   ['案件',d.project||'-','日期',d.date],
   ['類型',d.orderType==='new'?'首次採購':'追加採購','備註',d.note||'-']
  ].forEach(r=>{
    doc.setFont('helvetica','bold'); doc.text(r[0]+': ',14,y);
    doc.setFont('helvetica','normal'); doc.text(String(r[1]).substring(0,30),36,y);
    doc.setFont('helvetica','bold'); doc.text(r[2]+': ',110,y);
    doc.setFont('helvetica','normal'); doc.text(String(r[3]).substring(0,25),125,y);
    y+=5;
  });
  y+=3;
  doc.autoTable({
    startY:y,
    head:[['#','品名 Name','規格','單位','單價','數量','小計','備註']],
    body:d.items.map((it,i)=>[i+1,it.name.substring(0,28),it.spec.substring(0,14),it.unit,it.tbd?'TBD':'$'+it.price.toLocaleString(),it.qty,it.subtotal?'$'+it.subtotal.toLocaleString():'TBD',(it.note||it.tbdNote||'').substring(0,16)]),
    styles:{fontSize:7.5,cellPadding:2},
    headStyles:{fillColor:[26,26,26],textColor:[255,230,0],fontStyle:'bold',fontSize:8},
    alternateRowStyles:{fillColor:[248,248,248]},
    columnStyles:{0:{cellWidth:8,halign:'center'},1:{cellWidth:55},2:{cellWidth:22},3:{cellWidth:10,halign:'center'},4:{cellWidth:18,halign:'right'},5:{cellWidth:10,halign:'center'},6:{cellWidth:18,halign:'right'},7:{cellWidth:35}},
    margin:{left:14,right:14},
  });
  const fy=doc.lastAutoTable.finalY+6;
  doc.setFillColor(255,230,0); doc.rect(14,fy-3,182,9,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(26,26,26);
  doc.text('Product Total (excl. tax):',16,fy+2.5);
  doc.text('$'+d.total.toLocaleString()+(d.items.some(i=>i.tbd)?' + TBD':''),196,fy+2.5,{align:'right'});
  const ny=fy+14;
  doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.setTextColor(150);
  doc.text('* Installation, software setup and on-site items not included above.',14,ny);
  doc.setFontSize(8); doc.setTextColor(26,26,26);
  doc.text('Customer Signature: _______________________   Date: __________   Playmood: _______________________',14,ny+9);
  doc.save(`玩物智所採購單_${d.name}_${d.date.replace(/\//g,'')}.pdf`);
}
